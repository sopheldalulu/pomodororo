<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pomopet — cute study timer</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <h1>🌸 cozy pomopet</h1>
    <p class="subtitle">little steps, big dreams. ur bunny believes in u!</p>

    <div class="tabs" role="group" aria-label="Timer mode">
      <button class="active" data-mode="focus">🍓 Focus</button>
      <button data-mode="short">☁️ short break</button>
      <button data-mode="long">🌙 song break</button>
    </div>

    <div class="pet-zone">
      <div class="bubble" id="message" aria-live="polite">ready 2 grow together? ♡</div>
      <div class="pet" id="pet" role="img" aria-label="Cute peach bunny">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>
      <span class="sparkle">✦</span>
    </div>

    <div class="time" id="time" role="timer" aria-label="Time remaining">25:00</div>
    <div class="progress" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
      <div class="fill" id="fill"></div>
    </div>

    <div class="controls">
      <button class="primary" id="toggle">▶ start</button>
      <button id="reset">↻ reset</button>
    </div>

    <div class="stats">
      <span>🍓 focus sessions today</span>
      <strong id="count">0 / 4</strong>
    </div>

    <div class="settings">
      <label>focus <input id="focusMinutes" type="number" min="1" max="180" value="25">min</label>
      <label>short <input id="shortMinutes" type="number" min="1" max="60" value="5">min</label>
      <label>long <input id="longMinutes" type="number" min="1" max="120" value="15">min</label>
      <button id="apply">apply</button>
    </div>

    <p class="footer">tip: complete 4 focus sessions, then enjoy a long break ✨</p>
  </main>
</body>
</html>
