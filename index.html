<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>pomopet | pomodoro timer</title>
        <style>
            :root {
                font-family:ui-rounded,"SF Pro Rounded", system-ui, sans-serif;
                color: #514653;
                background: #fff5f4;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 22px;
                background: radial-gradient(circle at 20% 10%, #ffe2ee 0, transparent 32%),radial-gradient(circle at 90% 80%,#e3f7f3 0, transparent 35%),#fff7ee;
            }
            .app {
                width:min(440px,100%);
                padding: 30px;
                border-radius: 30px;
                background: #ffffffdb;
                box-shadow: 0 20px 60px #8a68701f;
                text-align: center;
                border: 2px solid #fff;
            }
            h1 {
                margin: 0;
                font-size: 29px;
                color: #6c5366;
            }
            .subtitle {
                margin: 7px 0 22px;
                color: #96848f;
                font-size: 14px;
            }
            .tabs {
                display: flex;
                gap: 8px;
                background: #fff0f2;
                padding: 6px;
                border-radius: 17px;
            }
            button {
                flex: 1;
                border: 0;
                background: transparent;
                padding: 12px 4px;
                border-radius: 12px;
                color: #937987;
                font-weight: 750;
                cursor: pointer;
            }
            .tabs button.archive {
                background: #fff;
                color: #d06d8c;
                box-shadow: 0 3px 10px #ba91a330;
            }
            .pet-zone {
                height: 215px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                position: relative;
            }
            .bubble {
                font-size: 13px;
                background: white;
                border: 1px solid #f8dae4;
                border-radius: 18px;
                padding: 9px 15px;
                margin: 10px 0 0;
                box-shadow: 0 4px 12px #a06c7b14
            }
            .pet {
                position: relative;
                width: 150px;
                height: 132px;
                margin-top: 20px;
                background: #f6bdac;
                border: 4px solid #aa7979;
                border-radius: 49% 49% 43% 43%;
                animation: breathe 2.6s ease-in-out infinite;
                box-shadow: inset -10px -11px #f0a69f, 0 9px #f2dfdb
            }
            .ear {
                position: absolute;
                top: -36px;
                width: 54px;
                height: 67px;
                background: #f6dcac;
                border: 4px solid #aa7979;
                border-radius: 60% 60% 25% 25%;
                z-index: -1;
            }

            .ear.left {
                left: 8px;
                transform: rotate(-19deg)
            }
            .ear.right {
                right: 8px;
                transform: rotate(19deg)
            }
            .ear:after {
                content: "";
                position: absolute;
                inset: 12px 11px 9px;
                background: #e89aa4;
                border-radius: inherit;
            }
            .eye {
                position: absolute;
                top: 54px;
                width: 11px;
                height: 14px;
                background: #684d56;
                border-radius: 50%
            }
            .eye.left {
                left: 42px;
            }
            .eye.right {
                right: 42px;
            }
            .nose {
                position: abosolute;
                left: 66px;
                top: 72px;
                width: 12px;
                height: 9px;
                background: #ad6778;
                border-radius: 50%;
            }
            .cheek {
                position: absolute;
                top: 77px;
                width: 24px;
                height: 12px;
                border-radius: 50%;
                background: #ee909e;
                opacity: .8
            }
            .cheek.left {
                left: 18px;
            }
            .cheek.right {
                right: 18px;
            }
            .mouth {
                position: absolute;
                top: 87px;
                left: 66px;
                width: 13px;
                height: 9px;
                border: 2px solid #9c6773;
                border-top: 0;
                border-radius: 0 0 50% 50;
            }
            .pet.sleepy .eye {
                height: 4px;
                top: 62px;
                border-radius: 50%
            }
            .pet.happy {
                animation: bounce .6s ease-in-out infinite alternate
            }
            .sparkle {
                position: absolute;
                top: 38px;
                right: 52px;
                color: #e4a447;
                font-size: 25px;
            }
            .time {
                font-variant-numeric: tabular-nums;
                font-size: 64px;
                letter-spacing: 2px;
                font-weight: 800;
                color: #70586d;
                line-height: 1.1;
            }
            .progress {
                height: 12px;
                border-radius: 10px;
                background: #f7e8ed;
                overflow: hidden;
                margin: 20px 0;
            }
            .fill {
                height: 100%;
                background: linear-gradient(90def,#f1a0ad,#c8a1e6);
                width: 0%;
                transition: width .4s
            }
            .controls {
                display: flex;
                justify-content: center;
                gap: 10px
            }
            .controls button,.settings button {
                border: 0;
                border-radius: 15px;
                padding: 13px 20px;
                background: #f4e9ed;
                color: #775e72;
                font-weight: 800;
                cursor: pointer;
            }
            .controls .primary {
                background:#d681a0;
                color:white;
                min-width:136px;
            }
            .stats {
                display:flex;
                justify-content:space-between;
                align-items:center;
                border-top:1px solid #f8e9ed;
                margin-top:24px;
                padding-top:18px;
                font-size:14px;
                color:#907b89
            }
            .settings {
                display:flex;
                justify-content:center;
                flex-wrap:wrap;
                gap:10px;
                margin-top:17px;
                font-size:13px;
                color:#998290
            }
            .settings label {
                display:flex;
                align-items:center;
                gap:5px
            }
            .settings input {
                width:50px;
                border:1px solid #edd7df;
                border-radius:7px;
                padding:6px;
                text-align:center;
                color:#6c5366
            }
            .settings button {
                padding:7px 11px;
                font-size:12px
            }
            .footer {
                font-size:12px;
                color:#b4a2aa;
                margin-top:17px
            }
            @keyframes breathe {
                50% {transform:translateY(-5px)}
            }
            @keyframes bounce {
                to{transform:translateY(-13px) rotate(3deg)}
            }
            @media(max-width:390px){
                .app{padding:20px}
                .time{font-size:54px}
                .tabs button{font-size:12px}}
        </style>
    </head>
</html>
